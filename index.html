<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>스니의 업무 레시피</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 스니의 업무 레시피 — 캔버스 1안(툴 주머니) · 입장+홈 · 레시피 노트 시안 기준 */
:root {
  --navy: #0A5A8F;
  --navy-deep: #0A4A75;
  --navy-btn: #0A6AA8;
  --ink: #0B2E45;
  --ink-soft: #1F4A66;
  --muted: #48667A;
  --plum: #8E2E5C;
  --plum-btn: #B0477A;
  --plum-ink: #4A3F55;
  --plum-muted: #6B5A70;
  --highlight: #FFE27A;
  --focus: #E4572E;
  --sky-soft: #DDF0FB;
  --pink-soft: #FCE6F1;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #CBE8FF 0%, #E3E2FF 42%, #FFE8F3 74%, #FFF3E2 100%);
  background-color: #FFF3E2;
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
}
a { color: var(--navy); }
a:hover { color: #063F66; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 3px;
}
.jua { font-family: 'Jua', sans-serif; font-weight: 400; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- 배경 장식 ---------- */
@keyframes drift { 0% { translate: 0 0 } 100% { translate: 60px 0 } }
@keyframes twinkle { 0%, 100% { transform: scale(.6); opacity: .4 } 50% { transform: scale(1.1); opacity: 1 } }
@keyframes float { 0% { transform: translate(0, 0) scale(1) } 100% { transform: translate(50px, 36px) scale(1.12) } }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg .ring {
  position: absolute; left: 50%; top: 90px; translate: -50% 0; width: 1400px; height: 1400px; border-radius: 50%;
  background: radial-gradient(closest-side, transparent 80%, #FFB7D5 82.5%, #FFD8B5 85.5%, #FFF2B5 88.5%, #BDF0D6 91.5%, #B4DAFF 94.5%, #D6C9FF 97%, transparent 99.5%);
  filter: blur(7px); opacity: .45;
}
.bg .cloud { position: absolute; }
.bg .cloud svg { filter: blur(2px); display: block; }
.bg .c-a { left: 5%; top: 110px; animation: drift 14s ease-in-out infinite alternate; }
.bg .c-b { right: 6%; top: 300px; animation: drift 18s ease-in-out infinite alternate-reverse; }
.bg .c-c { left: 12%; bottom: 120px; animation: drift 22s ease-in-out infinite alternate; }
.bg .star { position: absolute; animation: twinkle 2.4s ease-in-out infinite; }
.bg .blob { position: absolute; border-radius: 50%; animation: float 16s ease-in-out infinite alternate; opacity: 0; transition: opacity .6s; }
body.is-pocket .bg .blob { opacity: .7; }
.bg .b1 { left: -8%; top: -120px; width: 620px; height: 620px; background: #FFC6E3; filter: blur(90px); }
.bg .b2 { right: -10%; top: 40px; width: 680px; height: 680px; background: #D3C6FF; filter: blur(100px); animation-duration: 21s; animation-direction: alternate-reverse; }
.bg .b3 { left: 18%; top: 520px; width: 560px; height: 560px; background: #BFF3E4; filter: blur(100px); animation-duration: 26s; }
.bg .b4 { right: 12%; bottom: -160px; width: 600px; height: 600px; background: #FFE2C4; filter: blur(100px); }

.screen { position: relative; z-index: 1; overflow-x: clip; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 22px 20px 64px; display: flex; flex-direction: column; gap: 28px; }

/* ---------- 공통 상단 ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: 'Jua', sans-serif; font-size: 22px; color: var(--navy); }
.bear { flex: none; display: block; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0;
  background: rgba(255, 255, 255, .85); color: var(--navy-deep); font-size: 14px; font-weight: 700; text-decoration: none;
}
.pill-btn:hover { background: #FFFFFF; color: var(--navy-deep); }

/* ---------- 입장 ---------- */
@keyframes twirl { 0% { transform: rotate(-40deg) } 60% { transform: rotate(390deg) } 100% { transform: rotate(360deg) } }
@keyframes wave { 0%, 100% { transform: rotate(18deg) } 50% { transform: rotate(-6deg) } }
@keyframes shake { 0%, 100% { translate: 0 0 } 20%, 60% { translate: -8px 0 } 40%, 80% { translate: 8px 0 } }
.enter { min-height: 100vh; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
.enter .wand { transform-origin: 50% 95%; animation: twirl 1.1s cubic-bezier(.3, .9, .3, 1) .2s both, wave 2.6s ease-in-out 1.3s infinite; overflow: visible; }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--navy-deep); }
.sticker-title {
  margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; line-height: 1.1; color: var(--navy);
  -webkit-text-stroke: 12px #FFFFFF; paint-order: stroke fill; rotate: -2deg;
  filter: drop-shadow(0 6px 0 rgba(10, 90, 143, .22));
}
.enter .sticker-title { font-size: clamp(48px, 10vw, 84px); }
.enter-card {
  width: 100%; max-width: 420px; background: rgba(255, 255, 255, .85); border-radius: 30px; padding: 28px;
  box-shadow: 0 14px 34px rgba(10, 90, 143, .16); display: flex; flex-direction: column; gap: 14px;
}
@keyframes peek { 0%, 100% { translate: 0 0; rotate: 6deg } 50% { translate: 0 -5px; rotate: 2deg } }
.enter-card { position: relative; margin-top: 34px; }
.enter-card .peek { position: absolute; right: 28px; top: -60px; animation: peek 3s ease-in-out infinite; }
.enter-card.shake { animation: shake .4s ease; }
.enter-card label { font-family: 'Jua', sans-serif; font-size: 24px; color: var(--navy); }
.code-input {
  font-family: inherit; font-size: 20px; letter-spacing: 4px; text-align: center; width: 100%; min-height: 58px; padding: 0 18px;
  border: 3px solid #CFE6FA; border-radius: 18px; background: #FFFFFF; color: var(--ink);
}
.code-input:focus { border-color: var(--navy); outline: none; }
.primary-btn {
  min-height: 56px; border-radius: 18px; border: 0; background: var(--navy); color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 22px;
}
.primary-btn:disabled { opacity: .6; cursor: wait; }
.hint { font-size: 13px; color: var(--muted); }
.error { font-size: 14px; font-weight: 700; color: #B3261E; }

/* ---------- 홈 ---------- */
@keyframes rise { 0% { transform: translateY(24px) scale(.94); opacity: 0 } 100% { transform: none; opacity: 1 } }
@keyframes bob { 0%, 100% { translate: 0 0 } 50% { translate: 0 -6px } }
.rise { animation: rise .55s cubic-bezier(.3, 1.4, .5, 1) both; }
.r2 { animation-delay: .08s } .r3 { animation-delay: .16s } .r4 { animation-delay: .24s } .r5 { animation-delay: .32s }
.home-hero h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: clamp(32px, 6vw, 46px); line-height: 1.2; }
.home-hero p { margin: 6px 0 0; font-size: 17px; color: var(--ink-soft); }
.pockets { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.pocket {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 30px; border-radius: 32px;
  background: #FFFFFF; box-shadow: 0 14px 30px rgba(10, 90, 143, .14); color: var(--ink); text-decoration: none;
  transition: transform .2s cubic-bezier(.3, 1.5, .5, 1);
}
.pocket:hover { transform: translateY(-4px); color: var(--ink); }
.pocket .halo { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: var(--sky-soft); }
.pocket .row1 { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pocket .icon { width: 64px; height: 64px; border-radius: 22px; background: var(--navy); display: flex; align-items: center; justify-content: center; animation: bob 3.4s ease-in-out infinite; }
.pocket .tag { font-size: 13px; font-weight: 700; color: var(--navy); background: var(--sky-soft); border-radius: 12px; padding: 4px 12px; }
.pocket .name { position: relative; font-family: 'Jua', sans-serif; font-size: 34px; color: var(--navy); }
.pocket p { position: relative; margin: 0; color: var(--muted); }
.pocket .counts { position: relative; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.pocket .counts span { padding: 5px 12px; border-radius: 14px; background: #F3F8FD; }
.pocket .go { position: relative; align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 24px; background: var(--navy); color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 19px; }
.pocket.notes .halo { background: var(--pink-soft); }
.pocket.notes .icon { background: var(--plum-btn); animation-delay: .4s; }
.pocket.notes .tag { color: var(--plum); background: var(--pink-soft); }
.pocket.notes .name { color: var(--plum); }
.pocket.notes .counts span { background: #FDF3F8; }
.pocket.notes .go { background: var(--plum-btn); }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.mini {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 22px; border-radius: 24px; border: 0;
  background: rgba(255, 255, 255, .8); color: var(--ink); text-align: left; font-size: 16px; text-decoration: none;
}
.mini:hover { background: #FFFFFF; color: var(--ink); }
.mini .t { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.mini .s { font-size: 14px; color: var(--muted); }
.mini .l { font-size: 14px; font-weight: 700; color: var(--navy); }
.add-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; padding: 22px;
  border-radius: 24px; border: 2px dashed #7FC4EC; background: transparent; color: var(--navy); font-family: 'Jua', sans-serif; font-size: 20px;
}
.add-tile small { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--muted); }
.add-tile:hover { background: rgba(255, 255, 255, .5); }

/* ---------- 툴 주머니 (1안) ---------- */
@keyframes fly { 0% { transform: translate(var(--fx, var(--dx)), var(--fy, -240px)) scale(.05) rotate(var(--r)); opacity: 0 } 15% { opacity: 1 } 55% { transform: translate(calc(var(--fx, 0px) * .35), calc(var(--fy, 0px) * .45 - 70px)) scale(.8) rotate(calc(var(--r) * -.4)) } 100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1 } }
@keyframes puff { 0% { transform: scale(.2) rotate(var(--r)); opacity: 0 } 30% { transform: scale(1.25) rotate(var(--r)); opacity: 1 } 100% { transform: translateY(-46px) scale(1) rotate(var(--r)); opacity: 0 } }
@keyframes spark { 0% { transform: translate(0, 0) scale(.2); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0 } }
@keyframes glow { 0%, 100% { opacity: .18 } 50% { opacity: .42 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes sx { 0% { transform: translateX(-84px) rotate(2deg) } 100% { transform: translateX(84px) rotate(28deg) } }
@keyframes sy { 0% { transform: translateY(-20px) } 100% { transform: translateY(20px) } }
@keyframes tilebob { 0%, 100% { translate: 0 0 } 50% { translate: 0 -10px } }

.wrap.pocket-screen { max-width: 1120px; align-items: center; gap: 24px; }
.wrap.pocket-screen .topbar { width: 100%; }
.pocket-title { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.pocket-title h1 {
  margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 14px;
  font-family: 'Jua', sans-serif; font-weight: 400; line-height: 1.05; rotate: -3deg; filter: drop-shadow(0 8px 0 rgba(10, 90, 143, .28));
}
.pocket-title .w1 { font-size: clamp(50px, 9.5vw, 78px); color: #FFC94D; -webkit-text-stroke: 11px var(--navy); paint-order: stroke fill; letter-spacing: 2px; }
.pocket-title .w2 { font-size: clamp(46px, 8.5vw, 70px); color: #FFFFFF; -webkit-text-stroke: 11px var(--navy); paint-order: stroke fill; }
.pocket-title .q { font-family: 'Jua', sans-serif; font-size: clamp(24px, 4.5vw, 34px); color: var(--navy-deep); }
.pocket-title p { margin: 0; font-size: 17px; color: var(--ink-soft); }

.candies { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.candy {
  display: inline-flex; align-items: center; border: 0; background: transparent; padding: 0; min-height: 58px;
  filter: drop-shadow(0 6px 0 rgba(10, 90, 143, .16)); transition: transform .18s cubic-bezier(.3, 1.6, .5, 1);
}
/* 스니's making: 은빛 홀로그램 사탕 */
@keyframes holo { 0%, 100% { box-shadow: 0 0 0 2px #C9D2E0, 0 0 14px 3px rgba(190, 175, 255, .45) } 50% { box-shadow: 0 0 0 2px #D8DFEA, 0 0 24px 7px rgba(160, 220, 255, .6) } }
@keyframes holoshift { 0% { background-position: -120% 0, 0% 50%, 0 0 } 60%, 100% { background-position: 220% 0, 100% 50%, 0 0 } }
.candy.glow { --c: #B8C2D2; }
.candy.glow .body {
  color: #34405A; border-color: transparent;
  background-image:
    linear-gradient(105deg, rgba(255, 255, 255, 0) 35%, rgba(255, 255, 255, .95) 50%, rgba(255, 255, 255, 0) 65%),
    linear-gradient(110deg, rgba(255, 183, 213, .45), rgba(211, 198, 255, .45), rgba(159, 212, 255, .45), rgba(191, 243, 228, .45), rgba(255, 242, 181, .45)),
    linear-gradient(180deg, #FBFCFE, #DCE2EC);
  background-size: 60% 100%, 300% 100%, 100% 100%; background-repeat: no-repeat;
  animation: holo 2.8s ease-in-out infinite, holoshift 4s ease-in-out infinite alternate;
}
.candy.glow .body::before, .candy.glow .body::after { background: linear-gradient(180deg, #F2F4F8, #AEB8C8); }
.candy.glow .wr-l, .candy.glow .wr-r { background-color: #F3F5F9; background-image: repeating-linear-gradient(90deg, rgba(120, 135, 165, .3) 0 2px, rgba(255, 255, 255, 0) 2px 6px); }
.candy.glow .tw { animation: twinkle 1.8s ease-in-out infinite; }
.candy.glow.on .body { box-shadow: 0 0 0 3px #8E9BB3, 0 0 26px 8px rgba(180, 170, 255, .7); animation: holoshift 4s ease-in-out infinite alternate; }
.candy.glow .cnt { background: rgba(255, 255, 255, .85); color: #34405A; }
.pocket-tools { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.prow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.crow-scroll { flex-wrap: nowrap; }
.crow-scroll .candies { flex-wrap: nowrap; overflow-x: auto; padding: 8px 6px 12px; margin: -8px 0 -12px; scrollbar-width: thin; }
.crow-scroll .candy { flex: none; }
.candy-rows { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1 1 520px; }
.crow { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.clabel { flex: none; width: 78px; font-size: 13px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
.candies { gap: 6px 4px; justify-content: flex-start; }
.balls { display: flex; flex-wrap: wrap; gap: 16px; padding: 4px 0; }
.crow > .balls, .crow > .candies { flex: 1 1 0; min-width: 0; }
/* 알사탕: 동그랗고 반짝이는 파스텔 */
.ball {
  --b1: #FFFFFF; --b2: #FF9FC2; --ink: #7A1E48; position: relative; flex: none; width: 92px; height: 92px; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: var(--b1); color: var(--ink); font-family: 'Jua', sans-serif; font-size: 17px; line-height: 1.15;
  box-shadow: inset 0 -10px 16px rgba(10, 40, 80, .14), inset 0 6px 10px rgba(255, 255, 255, .7), 0 7px 0 rgba(10, 90, 143, .14), 0 12px 20px rgba(10, 90, 143, .12);
  overflow: visible; isolation: isolate; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
/* 소용돌이 줄무늬 */
.ball::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(255, 255, 255, .92) 0 38%, rgba(255, 255, 255, 0) 62%), repeating-conic-gradient(from 10deg, var(--b2) 0 18deg, var(--b1) 18deg 36deg);
}
/* 반짝이는 하이라이트 */
.ball::after { content: ""; position: absolute; left: 20%; top: 14%; width: 30%; height: 20%; border-radius: 50%; background: rgba(255, 255, 255, .95); filter: blur(1px); rotate: -30deg; }
.ball .lbl { position: relative; z-index: 1; text-align: center; text-shadow: 0 1px 0 rgba(255, 255, 255, .9); }
.ball .cnt { position: absolute; right: -4px; top: -2px; z-index: 2; min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 13px; background: #FFFFFF; color: var(--navy); box-shadow: 0 2px 6px rgba(10, 90, 143, .2); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.ball:hover { transform: translateY(-4px) rotate(-6deg); }
.ball.on { transform: scale(1.08); box-shadow: inset 0 -10px 16px rgba(10, 40, 80, .14), inset 0 6px 10px rgba(255, 255, 255, .7), 0 0 0 4px var(--navy), 0 10px 22px rgba(10, 90, 143, .25); }
.ball.on::before { animation: spin 4s linear infinite; }
.ball.b2 { --b2: #6FD6AE; --ink: #0B5A40; }
.specials { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.prow > .search { flex: 0 1 230px; min-width: 190px; }
.prow > .search input { min-height: 48px; box-shadow: 0 8px 20px rgba(10, 90, 143, .10); }
.prow > .crow-scroll { flex: 1 1 0; min-width: 0; }
.pocket-side .search { flex: 1 1 auto; min-width: 0; }
.pocket-side .search input { min-height: 48px; }
.secret-pill { flex: none; }
.pocket-side .search input { box-shadow: 0 8px 20px rgba(10, 90, 143, .10); }
.secret-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid #C9D5E2; background: rgba(255, 255, 255, .8); color: #4C5D6E; font-size: 14px; font-weight: 700; }
.secret-pill.on { border-color: var(--navy); background: var(--navy); color: #FFFFFF; }
.candy { min-height: 46px; filter: drop-shadow(0 4px 0 rgba(10, 90, 143, .14)); }
.candy:hover { transform: translateY(-4px) rotate(-3deg); }
.candy .body {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 9px; min-height: 52px; padding: 0 20px; border-radius: 18px;
  border: 2px solid rgba(10, 90, 143, .12); background-color: #FFFFFF;
  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0) 55%, rgba(10, 90, 143, .05));
  color: var(--ink); font-family: 'Jua', sans-serif; font-size: 20px; white-space: nowrap;
}
.candy .body::before, .candy .body::after {
  content: ""; position: absolute; top: 50%; width: 10px; height: 28px; translate: 0 -50%; border-radius: 5px; background: var(--c);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .08);
}
.candy .body::before { left: -12px; } .candy .body::after { right: -12px; }
.candy .cnt {
  min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: #EEF4FA; color: var(--navy);
  font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
}
.candy .wr-l, .candy .wr-r { width: 24px; height: 40px; background-color: #FFFFFF; background-image: repeating-linear-gradient(90deg, rgba(10, 90, 143, .13) 0 2px, rgba(255, 255, 255, 0) 2px 6px); }
.candy .wr-l { clip-path: polygon(0 0, 100% 36%, 100% 64%, 0 100%, 24% 50%); margin-right: 4px; }
.candy .wr-r { clip-path: polygon(100% 0, 0 36%, 0 64%, 100% 100%, 76% 50%); margin-left: 4px; }
.candy .body { min-height: 40px; padding: 0 14px; border-radius: 14px; font-size: 17px; gap: 7px; }
.candy .body::before, .candy .body::after { width: 8px; height: 22px; }
.candy .body::before { left: -10px; } .candy .body::after { right: -10px; }
.candy .cnt { min-width: 22px; height: 22px; font-size: 12px; }
.candy .wr-l, .candy .wr-r { width: 18px; height: 30px; }
.candy.on { transform: scale(1.08) rotate(-3deg); }
.candy.on .body { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
.c1 { --c: #FF8FBF } .c2 { --c: #FFC93C } .c3 { --c: #5FD3A5 } .c4 { --c: #7FA8FF } .c5 { --c: #B28CFF } .c6 { --c: #FF9F6B } .c7 { --c: #A9B4C6 }

.tiles { position: relative; z-index: 3; min-height: 212px; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px 20px; }
.tile {

  if (!sb) return;
  if (pw) sb.rest.headers['x-secret-pw'] = pw;

}

}
function toRow(d) {
  const r = {
    section: d.section, title: d.title, kind: d.kind, url: d.url || null, body: d.body || null, descr: d.desc || null,
    pockets: d.pockets || [], mine: !!d.mine, tab: d.tab || null, sub: d.sub || null, doc_date: d.date || null, secret: !!d.secret

}

async function withFileUrls(list) {
  const paths = list.filter((d) => d.filePath).map((d) => d.filePath);
  if (!paths.length) return list;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (error) return list;
  const map = {};
  data.forEach((x) => { if (x.signedUrl) map[x.path] = x.signedUrl; });
  list.forEach((d) => { if (d.filePath && map[d.filePath]) d.url = map[d.filePath]; });
  return list;
}
async function upload(file) {
  const { data: { user } } = await sb.auth.getUser();
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined });
  if (error) throw new Error('파일을 올리지 못했어요. 50MB 이하인지 확인해주세요.');
  return path;
}

  },
  async updateItem(id, item, file, old) {
    const d = Object.assign({}, item);
    if (file) d.filePath = await upload(file);

    if (file && old && old.filePath) await sb.storage.from(BUCKET).remove([old.filePath]);
  },
  async deleteItem(id, old) {
    const { error } = await sb.from('items').delete().eq('id', id);
    if (error) throw new Error('지우지 못했어요. 다시 해주세요.');
    if (old && old.filePath) await sb.storage.from(BUCKET).remove([old.filePath]);
  }
};

// ---------- 라우팅 ----------
const routes = { enter: renderEnter, home: renderHome, pocket: renderPocket, notes: renderNotes, secret: renderSecret };

async function route() {
  const name = (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0];
  const authed = await db.getSession();
  if (!authed && name !== 'enter') return go('enter');
  if (authed && name === 'enter') return go('home');
  document.body.classList.toggle('is-pocket', name === 'pocket');
  (routes[name] || renderHome)();
  window.scrollTo(0, 0);
}
function go(name) {
  if (location.hash === '#/' + name) route();
  else location.hash = '#/' + name;
}
window.addEventListener('hashchange', route);

function topbar(back) {
  return `<header class="topbar">
    ${back ? `<a class="pill-btn" href="#/home">${BACK}${NAME.short}로</a>` : `<div class="brand">${bear(30)}${NAME.full}</div>`}
    ${back ? `<span class="brand">${bear(26)}${NAME.full}</span>` : `<button type="button" class="pill-btn" data-act="signout">${LOCK}레시피 덮기</button>`}

}

const FLY = [[300, -50, 34], [180, 40, 0], [60, -25, 48], [-60, 30, 10], [-180, -40, 40], [-300, 55, 4], [120, -35, 30], [-120, 45, 8], [80, -40, 20], [-80, 40, 0]];

const matchPurpose = (d, p) => !p || (d.pockets || []).includes(p);
const matchType = (d, f) => !f || (f === 'mine' ? d.mine : d.kind === f);

// 지금 꺼낼 툴. null이면 아직 아무것도 안 고른 상태
function pocketList() {
  if (state.secretView) return state.secret ? state.secret.filter((d) => d.section === 'tool') : [];
  const tools = state.items.filter((d) => d.section === 'tool');
  const q = state.pq.trim().toLowerCase();
  if (q) return tools.filter((d) => (d.title + ' ' + (d.desc || '') + ' ' + (d.body || '')).toLowerCase().includes(q));
  if (!state.purpose && !state.ftype) return null;
  return tools.filter((d) => matchPurpose(d, state.purpose) && matchType(d, state.ftype));
}

function paintCandies() {
  const tools = state.items.filter((d) => d.section === 'tool');
  const off = !!state.pq.trim() || state.secretView;
  document.getElementById('balls').innerHTML = POCKETS.map((p, i) => {
    const on = !off && p.id === state.purpose;
    const n = tools.filter((d) => matchPurpose(d, p.id) && matchType(d, state.ftype)).length;
    return `<button type="button" class="ball b${i + 1}${on ? ' on' : ''}" aria-pressed="${on}" data-purpose="${p.id}"><span class="lbl">${p.label.replace(' ', '<br>')}</span><span class="cnt">${n}</span></button>`;
  }).join('');
  const candy = (f, i) => {
    const on = !off && f.id === state.ftype;
    const n = tools.filter((d) => matchPurpose(d, state.purpose) && matchType(d, f.id)).length;
    const mine = f.id === 'mine';
    return `<button type="button" class="candy c${i + 1}${mine ? ' glow' : ''}${on ? ' on' : ''}" aria-pressed="${on}" data-ftype="${f.id}"><span class="wr-l" aria-hidden="true"></span><span class="body">${mine ? `<svg class="tw" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}" fill="#B9A6F2"/></svg>` : ''}<span>${f.label}</span><span class="cnt">${n}</span></span><span class="wr-r" aria-hidden="true"></span></button>`;
  };
  document.getElementById('making').innerHTML = candy(FTYPES.find((f) => f.id === 'mine'), 0);
  document.getElementById('candies').innerHTML = FTYPES.filter((f) => f.id !== 'mine').map((f, i) => candy(f, i + 1)).join('');
  const pill = document.getElementById('secret-pill');
  pill.classList.toggle('on', state.secretView);
  pill.setAttribute('aria-pressed', state.secretView);
  pill.innerHTML = `${LOCK}시크릿 서랍${state.secretView ? ' 닫기' : ''}`;
}

function paintTiles() {
  const box = document.getElementById('tiles');
  if (!box) return;
  if (state.stirring) { box.innerHTML = ''; return; }
  const list = pocketList();
  if (!list) {
    box.innerHTML = '<div class="bubble">사탕을 고르거나 검색하면 요술봉이 툴을 꺼내줘요</div>';
    return;
  }
  if (state.secretView && !state.secret) {
    box.innerHTML = lockCard('pocket');
    bindLockCard();
    return;
  }
  let html = list.map((d, i) => {
    const f = FLY[i % FLY.length];
    return `<button type="button" class="tile${state.picked === d.id ? ' on' : ''}" data-pick="${d.id}" style="--dx:${f[0]}px;--r:${f[1]}deg;margin-top:${f[2]}px;animation-delay:${(i * 0.09).toFixed(2)}s"><span style="animation-duration:${(3.1 + (i % 5) * 0.3).toFixed(1)}s">
      ${kindTag(d.kind)}${icon(d.kind, 44, '#0A6AA8')}<span class="nm">${esc(d.title)}</span></span></button>`;
  }).join('');
  if (!list.length) html = `<div class="bubble">${state.pq.trim() ? '찾는 툴이 없어요' : '이 조합에 맞는 툴이 아직 없어요'}</div>`;
  if (state.secretView) html += '<button type="button" class="relock" data-act="relock" style="flex-basis:100%;max-width:160px">다시 잠그기</button>';
  box.innerHTML = html;
  launchFromSwirl(box);
}

// 툴이 오로라 한가운데에서 출발해 제자리로 날아오게 출발점을 잡는다
function launchFromSwirl(box) {
  const sw = document.querySelector('.swirl-btn');
  if (!sw) return;
  const s = sw.getBoundingClientRect();
  const b = box.getBoundingClientRect();
  const cx = s.left + s.width / 2 - b.left;
  const cy = s.top + s.height / 2 - b.top;
  box.querySelectorAll('.tile').forEach((el) => {
    el.style.setProperty('--fx', Math.round(cx - (el.offsetLeft + el.offsetWidth / 2)) + 'px');
    el.style.setProperty('--fy', Math.round(cy - (el.offsetTop + el.offsetHeight / 2)) + 'px');
  });
}

function paintDetail() {
  const box = document.getElementById('detail');
  if (!box) return;
  const all = state.items.concat(state.secret || []);
  const d = all.find((x) => x.id === state.picked);
  if (!d) {
    box.innerHTML = '<div class="empty">튀어나온 툴을 누르면 설명과 바로가기가 여기에 나와요.</div>';
    return;
  }
  const meta = [KIND_LABEL[d.kind], d.mine ? "스니's Tool" : '', d.secret ? '시크릿' : ''].filter(Boolean).join(' · ');
  const tags = (d.pockets || []).map(pocketLabel).join(' · ');
  let action;
  if (d.kind === 'MENT') action = `<button type="button" class="go-btn" data-copy="${d.id}">멘트 복사</button>`;
  else if (d.url) action = `<a class="go-btn" href="${esc(d.url)}" target="_blank" rel="noopener">꺼내 쓰기</a>`;
  else action = '<span class="ghost-btn" aria-disabled="true">주소 준비 중</span>';
  box.innerHTML = `<div class="has">
    <div class="info">
      <div class="nm">${esc(d.title)}</div>
      ${d.desc ? `<div class="ds">${esc(d.desc)}</div>` : ''}
      <div class="meta">${meta}${tags ? ' · ' + tags : ''}</div>
    </div>
    <div class="acts">${action}${manageBtns(d)}</div>
    ${d.kind === 'MENT' && d.body ? `<div class="ment">${esc(d.body)}</div>` : ''}
  </div>`;
}

function stir(next) {
  Object.assign(state, next, { stirring: true });
  document.getElementById('swirl')?.classList.add('stirring');
  paintCandies();
  paintTiles();
  clearTimeout(stir.t);
  stir.t = setTimeout(() => {
    state.stirring = false;
    document.getElementById('swirl')?.classList.remove('stirring');
    const fx = document.getElementById('swirl-fx');
    if (fx && pocketList()) {
      fx.innerHTML = `<div class="pf" style="left:8%;top:-34px;--r:-14deg;font-size:40px;color:#E4572E;animation-delay:.1s">뾱!</div>
        <div class="pf" style="right:6%;top:-50px;--r:12deg;font-size:30px;color:#0A5A8F;animation-delay:.35s">뾰뿁!</div>

        <svg class="sp" width="20" height="20" viewBox="0 0 24 24" style="left:48%;--dx:10px;--dy:-150px;animation-delay:.2s"><path d="${STAR}" fill="#FFFFFF"/></svg>
        <svg class="sp" width="28" height="28" viewBox="0 0 24 24" style="left:62%;--dx:100px;--dy:-110px;animation-delay:.3s"><path d="${STAR}" fill="#FF9F45"/></svg>`;
    }
    paintTiles();
    paintDetail();
  }, 560);
}

// ---------- 시크릿 잠금 ----------
function lockCard(where) {
  return `<form class="lock-card" data-lock="${where}" novalidate>
    <div class="t">${LOCK}시크릿 서랍</div>
    <div class="s">원장님 앞에서 화면을 띄울 때 보이면 안 되는 툴과 기록이 들어 있어요.</div>
    <label for="secret-pw-${where}">비밀번호</label>
    <input id="secret-pw-${where}" class="field-input" type="password" autocomplete="off">
    <div class="error" role="alert" hidden></div>
    <button type="submit" class="open-btn">열려라 참깨</button>
  </form>`;
}
function bindLockCard() {
  document.querySelectorAll('form[data-lock]').forEach((f) => {
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = f.querySelector('.error');
      try {
        state.secretPw = f.querySelector('input').value;
        state.secret = await db.unlockSecret(state.secretPw);
        if (f.dataset.lock === 'pocket') stir({});
        else renderSecret();
      } catch (ex) {
        err.textContent = ex.message || '비밀번호가 맞지 않아요.';
        err.hidden = false;
      }
    });
  });
}

// ---------- 레시피 노트 · 시크릿 서랍 목록 ----------
function docRow(d) {
  const meta = d.section === 'tool' ? ['툴 주머니', (d.pockets || []).map(pocketLabel).join(' · ')].filter(Boolean).join(' · ') : noteMeta(d);
  const open = d.kind === 'MENT'
    ? `<button type="button" class="open" data-copy="${d.id}" style="border:0">복사</button>`
    : d.url ? `<a class="open" href="${esc(d.url)}" target="_blank" rel="noopener">열기</a>` : '<span class="open disabled" aria-disabled="true">링크 준비 중</span>';
  const dl = isFileKind(d.kind) && d.url
    ? `<a class="dl" href="${esc(d.url)}" download aria-label="${esc(d.title)} 내려받기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E2E5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>` : '';
  return `<div class="doc-row">
    <span class="ic">${icon(d.kind, 22, '#8E2E5C')}</span>
    <div class="info"><div class="tl"><b>${esc(d.title)}</b>${kindTag(d.kind)}</div><div class="mt">${esc(meta)}</div></div>
    <div class="acts">${open}${dl}${manageBtns(d)}</div>
  </div>`;
}

function renderNotes() {
  app.innerHTML = `<div class="wrap notes-screen">
    ${topbar(true)}
    <section class="notes-hero">
      <h1 class="notes-title">레시피 노트</h1>
      <p>내가 직접 쓴 보고서와 발표 자료를 모아둔 노트예요.</p>
      <div class="book-stage" id="book">
        <div class="book-aura" aria-hidden="true"></div>
        <div class="book-fx" id="book-fx" aria-hidden="true"></div>
        <button type="button" class="book-btn" data-act="flip" aria-label="요술봉으로 노트 다시 넘기기">
          <span class="book" aria-hidden="true">
            <span class="cover"></span>
            <span class="page pl"></span><span class="page pr"></span>
            <span class="flip fp1"></span><span class="flip fp2"></span><span class="flip fp3"></span>
            <span class="spine"></span>
          </span>
        </button>
        <div class="nwand-x" aria-hidden="true"><div class="nwand-y">
          <svg viewBox="0 0 120 232" style="display:block;width:100%;overflow:visible"><rect x="53" y="6" width="14" height="150" rx="7" fill="#FFFFFF" stroke="#0A5A8F" stroke-width="4"/><path d="M55 36l10-10M55 66l10-10M55 96l10-10M55 126l10-10" stroke="#F5A8C8" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,134)"><path d="M60 2l14 30 33 5-24 23 6 33-29-16-29 16 6-33-24-23 33-5z" fill="#FFC94D" stroke="#0A5A8F" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="42" r="5" fill="#FFFFFF" opacity=".9"/></g></svg>
        </div></div>
        <div class="book-cap">요술봉이 휙휙 넘기는 중. 누르면 다시 촤라락!</div>
      </div>
    </section>
    <div class="notes-tools">
      <div class="big-tabs" id="big-tabs"></div>
      <div class="search">
        <label for="nq" class="sr-only">노트 검색</label>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E2E5C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
        <input id="nq" type="search" placeholder="제목으로 찾기 (예: 인수인계, 월례)" value="${esc(state.noteQ)}">
      </div>
    </div>
    <div class="sub-tabs" id="sub-tabs"></div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="result-label" id="result-label"></div>
      <div class="doc-list" id="doc-list"></div>
    </section>
    <button type="button" class="notes-add" data-act="add" data-section="note">＋ 새 기록 넣기</button>
  </div>`;
  document.getElementById('nq').addEventListener('input', (e) => { state.noteQ = e.target.value; paintNotes(false); });
  flipBook();
}

// 요술봉이 오로라 책을 휙휙 넘기고, 기록이 책에서 뾰로롱 튀어나온다
function flipBook() {
  const stage = document.getElementById('book');
  if (!stage) return;
  stage.classList.remove('flipping');
  void stage.offsetWidth;
  stage.classList.add('flipping');
  document.getElementById('book-fx').innerHTML = `<div class="pf" style="left:4%;top:-30px;--r:-12deg;font-size:34px;color:#B0477A;animation-delay:.15s">촤라락!</div>
    <div class="pf" style="right:4%;top:-44px;--r:10deg;font-size:28px;color:#0A5A8F;animation-delay:.4s">뾰로롱!</div>
    <svg class="sp" width="24" height="24" viewBox="0 0 24 24" style="left:28%;--dx:-80px;--dy:-110px;animation-delay:.2s"><path d="${STAR}" fill="#FFB7D5"/></svg>
    <svg class="sp" width="18" height="18" viewBox="0 0 24 24" style="left:50%;--dx:0px;--dy:-140px;animation-delay:.3s"><path d="${STAR}" fill="#FFFFFF"/></svg>
    <svg class="sp" width="26" height="26" viewBox="0 0 24 24" style="left:66%;--dx:90px;--dy:-100px;animation-delay:.35s"><path d="${STAR}" fill="#FFE27A"/></svg>`;
  clearTimeout(flipBook.t);
  flipBook.t = setTimeout(() => stage.classList.remove('flipping'), 900);
  paintNotes(true);
}

function paintNotes(fly) {
  const notes = state.items.filter((d) => d.section === 'note');
  const { noteTab: tab, noteSub: sub } = state;
  const q = state.noteQ.trim().toLowerCase();
  const inTab = (d, t) => t === 'all' || d.tab === t;
  const tabs = [['all', '전체']].concat(Object.keys(NOTE_TABS).map((k) => [k, NOTE_TABS[k].label]));
  document.getElementById('big-tabs').innerHTML = tabs.map(([id, label]) => {
    const on = id === tab;
    return `<button type="button" class="big pencil p-${id}${on ? ' on' : ''}" aria-pressed="${on}" data-tab="${id}"><span>${label}</span><span class="n">${notes.filter((d) => inTab(d, id)).length}</span></button>`;
  }).join('');
  const subBox = document.getElementById('sub-tabs');
  if (tab === 'all') subBox.innerHTML = '';
  else {
    const subs = [['all', '전체']].concat(Object.entries(NOTE_TABS[tab].subs));
    subBox.innerHTML = subs.map(([id, label]) => `<button type="button" class="sub${id === sub ? ' on' : ''}" aria-pressed="${id === sub}" data-sub="${id}">${label}</button>`).join('');
  }
  subBox.hidden = tab === 'all';
  const list = notes.filter((d) => inTab(d, tab) && (sub === 'all' || d.sub === sub) && (!q || d.title.toLowerCase().includes(q)));
  const label = tab === 'all' ? '전체' : NOTE_TABS[tab].label + (sub === 'all' ? '' : ' · ' + NOTE_TABS[tab].subs[sub]);
  document.getElementById('result-label').textContent = `${label}${q ? ` · "${state.noteQ.trim()}" 검색` : ''} · ${list.length}개`;
  const box = document.getElementById('doc-list');
  box.innerHTML = list.length ? list.map(docRow).join('') : '<div class="doc-empty">해당하는 기록이 없어요.</div>';
  if (fly) box.querySelectorAll('.doc-row').forEach((row, i) => { row.classList.add('fly-out'); row.style.animationDelay = (0.45 + i * 0.07).toFixed(2) + 's'; });
}

function renderSecret() {
  const body = state.secret
    ? `<div class="result-label">시크릿 ${state.secret.length}개</div>
       <div class="doc-list">${state.secret.length ? state.secret.map(docRow).join('') : '<div class="doc-empty">서랍이 비어 있어요. 새 재료를 넣을 때 "시크릿 서랍에 넣기"를 체크하세요.</div>'}</div>
       <button type="button" class="relock" data-act="relock" style="align-self:flex-start">다시 잠그기</button>`
    : `<div style="display:flex;justify-content:center;padding-top:20px">${lockCard('page')}</div>`;
  app.innerHTML = `<div class="wrap secret-screen">
    ${topbar(true)}
    <section class="notes-head"><div>
      <div class="ttl"><span class="ic" style="background:#0A5A8F;color:#FFFFFF">${LOCK.replace('width="20" height="20"', 'width="28" height="28"')}</span><h1 style="color:#0A5A8F">시크릿 서랍</h1></div>
      <p>툴 주머니와 레시피 노트에서 "시크릿"으로 넣은 것만 모여 있어요.</p>
    </div></section>
    ${body}
  </div>`;
  bindLockCard();
}

// ---------- 새 재료 넣기 ----------
function openSheet(section, edit) {
  if (edit) section = edit.section;
  const noteOpts = Object.entries(NOTE_TABS).map(([t, v]) => `<optgroup label="${v.label}">${Object.entries(v.subs).map(([s, l]) => `<option value="${t}/${s}">${l}</option>`).join('')}</optgroup>`).join('');
  sheetRoot.innerHTML = `<div class="sheet-back" id="sheet-back">
    <form class="sheet" id="add-form" role="dialog" aria-modal="true" aria-labelledby="add-title" novalidate>
      <h2 id="add-title">${edit ? '재료 고치기' : '새 재료 넣기'}</h2>
      <fieldset><legend>어디에 넣을까요?</legend>
        <div class="seg">
          <label><input type="radio" name="section" value="tool" ${section !== 'note' ? 'checked' : ''}><span>툴 주머니</span></label>
          <label><input type="radio" name="section" value="note" ${section === 'note' ? 'checked' : ''}><span>레시피 노트</span></label>
        </div>
      </fieldset>
      <div class="f"><label for="add-name">이름</label><input id="add-name" name="itemTitle" class="field-input" type="text" placeholder="예: 혈액검사 패키지 계산기" required></div>
      <fieldset><legend>종류</legend><div class="seg" id="kind-seg"></div></fieldset>
      <div class="f" id="f-url"><label for="add-url">주소</label><input id="add-url" name="url" class="field-input" type="url" placeholder="https://"></div>
      <div class="f" id="f-file"><label for="add-file">파일</label><input id="add-file" name="file" type="file"></div>
      <div class="f" id="f-body"><label for="add-body">멘트 내용</label><textarea id="add-body" name="body" class="field-input" placeholder="[원장님 반응] …&#10;[대응 멘트] …"></textarea></div>
      <div class="f" id="f-desc"><label for="add-desc">한 줄 설명</label><input id="add-desc" name="desc" class="field-input" type="text" placeholder="언제, 어떻게 쓰는 툴인지"></div>
      <fieldset id="f-pockets"><legend>어디에 쓸까 (여러 개 가능)</legend>
        <div class="opts">${POCKETS.map((p) => `<label><input type="checkbox" name="pockets" value="${p.id}"> ${p.label}</label>`).join('')}</div>
      </fieldset>
      <label id="f-mine" class="opts"><span><input type="checkbox" name="mine" checked> 내가 만든 거예요 (스니's making에도 넣기)</span></label>
      <div class="f" id="f-cat"><label for="add-cat">분류</label><select id="add-cat" name="cat" class="field-input">${noteOpts}</select></div>
      <div class="f" id="f-date"><label for="add-date">날짜</label><input id="add-date" name="date" class="field-input" type="text" placeholder="예: 2026.10"></div>
      <p class="note" id="f-sensitive">거래처 실명, 동료 평가가 들어간 문서는 파일 대신 사내 드라이브 링크로 넣어주세요.</p>
      <label class="opts"><span><input type="checkbox" name="secret"> 시크릿 서랍에 넣기 (비밀번호를 넣어야 보임)</span></label>
      <div class="error" id="add-err" role="alert" hidden></div>
      <div class="btns"><button type="submit" class="go-btn">${edit ? '고치기 완료' : '쇽! 넣기'}</button><button type="button" class="ghost-btn" data-act="close-sheet">취소</button></div>
    </form>
  </div>`;
  const form = document.getElementById('add-form');
  const sync = () => {
    const sec = form.querySelector('input[name=section]:checked').value;
    const kinds = sec === 'note' ? NOTE_KINDS : TOOL_KINDS;
    const seg = document.getElementById('kind-seg');
    const cur = form.querySelector('input[name=kind]:checked')?.value;
    if (seg.dataset.sec !== sec) {
      seg.dataset.sec = sec;
      seg.innerHTML = kinds.map((k, i) => `<label><input type="radio" name="kind" value="${k.id}" ${i === 0 ? 'checked' : ''}><span>${k.label}</span></label>`).join('');
      seg.querySelectorAll('input').forEach((r) => r.addEventListener('change', sync));
    }
    const kind = form.querySelector('input[name=kind]:checked')?.value || cur;
    const isTool = sec === 'tool';
    document.getElementById('f-url').hidden = !(kind === 'URL' || kind === 'HTML' || kind === 'LINK' || kind === 'BD');
    document.getElementById('f-file').hidden = !isFileKind(kind);
    document.getElementById('f-body').hidden = kind !== 'MENT';
    document.getElementById('f-desc').hidden = !isTool;
    document.getElementById('f-pockets').hidden = !isTool;
    document.getElementById('f-mine').hidden = !isTool;
    document.getElementById('f-cat').hidden = isTool;
    document.getElementById('f-date').hidden = isTool;
    document.getElementById('f-sensitive').hidden = isTool;
    document.getElementById('add-file').accept = { PDF: '.pdf', IMG: 'image/*', BD: '.pdf,.ppt,.pptx,image/*', PPT: '.ppt,.pptx', DOCX: '.doc,.docx,.hwp' }[kind] || '';
  };
  form.querySelectorAll('input[name=section]').forEach((r) => r.addEventListener('change', sync));
  sync();
  if (edit) {
    const k = form.querySelector(`input[name=kind][value="${edit.kind}"]`);
    if (k) k.checked = true;
    document.getElementById('add-name').value = edit.title;
    if (!edit.filePath) document.getElementById('add-url').value = edit.url || '';
    document.getElementById('add-body').value = edit.body || '';
    document.getElementById('add-desc').value = edit.desc || '';
    form.querySelectorAll('input[name=pockets]').forEach((c) => { c.checked = (edit.pockets || []).includes(c.value); });
    form.querySelector('input[name=mine]').checked = !!edit.mine;
    if (edit.tab) document.getElementById('add-cat').value = `${edit.tab}/${edit.sub}`;
    document.getElementById('add-date').value = edit.date || '';
    form.querySelector('input[name=secret]').checked = !!edit.secret;
    if (edit.filePath) document.querySelector('#f-file label').textContent = '파일 (새로 고르면 바꿔요)';
    sync();
  }
  document.getElementById('add-name').focus();
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('add-err');
    const fd = new FormData(form);
    const sec = fd.get('section');
    const kind = fd.get('kind');
    const item = { section: sec, title: (fd.get('itemTitle') || '').trim(), kind, secret: !!fd.get('secret') };
    const file = document.getElementById('add-file').files[0];
    if (!item.title) return showErr('이름을 넣어주세요.');
    if (!form.querySelector('#f-url').hidden) {
      item.url = (fd.get('url') || '').trim();
      if (kind === 'BD' && !item.url) item.url = '';
      else if (!/^https?:\/\//.test(item.url)) return showErr(kind === 'BD' ? 'BD는 파일을 고르거나 https:// 주소를 넣어주세요.' : '주소는 https:// 로 시작해야 해요.');
    }
    const hasOldFile = edit && edit.filePath && edit.kind === kind;
    if (kind === 'BD' && !item.url && !file && !hasOldFile) return showErr('BD는 파일을 고르거나 https:// 주소를 넣어주세요.');
    if (isFileKind(kind) && kind !== 'BD' && !file && !hasOldFile) return showErr('파일을 골라주세요.');
    if (item.url) item.filePath = '';
    else if (!file && !hasOldFile) item.filePath = '';
    if (kind === 'MENT') {
      item.body = (fd.get('body') || '').trim();
      if (!item.body) return showErr('멘트 내용을 넣어주세요.');
    }
    if (sec === 'tool') {
      item.desc = (fd.get('desc') || '').trim();
      item.pockets = fd.getAll('pockets');
      item.mine = !!fd.get('mine');
    } else {
      [item.tab, item.sub] = String(fd.get('cat')).split('/');
      item.date = (fd.get('date') || '').trim();
    }
    try {
      form.querySelector('button[type=submit]').disabled = true;
      if (edit) await db.updateItem(edit.id, item, file, edit);
      else await db.addItem(item, file);
      await reload();
      if (state.secret) state.secret = await db.unlockSecret(state.secretPw);
      closeSheet();
      toast(edit ? '고쳤어요' : item.secret ? '시크릿 서랍에 쏙 넣었어요' : sec === 'note' ? '레시피 노트에 넣었어요' : '주머니에 쏙 넣었어요');
      route();
    } catch (ex) {
      showErr(ex.message || '넣지 못했어요. 다시 해주세요.');
      form.querySelector('button[type=submit]').disabled = false;
    }
    function showErr(m) { err.textContent = m; err.hidden = false; }
  });
}
function closeSheet() { sheetRoot.innerHTML = ''; }

// ---------- 이벤트 ----------
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act],[data-purpose],[data-ftype],[data-pick],[data-copy],[data-tab],[data-sub],[data-edit],[data-del]');
  if (!t) {
    if (e.target.id === 'sheet-back') closeSheet();
    return;
  }
  if (t.dataset.edit) {
    const d = findItem(t.dataset.edit);
    if (d) openSheet(d.section, d);
    return;
  }
  if (t.dataset.del) {
    // 한 번 더 눌러야 지운다
    if (!t.classList.contains('armed')) {
      t.classList.add('armed');
      t.innerHTML = '정말 지울까요?';
      setTimeout(() => { if (t.isConnected) { t.classList.remove('armed'); t.innerHTML = TRASH; } }, 3000);
      return;
    }
    const d = findItem(t.dataset.del);
    try {
      await db.deleteItem(d.id, d);
      await reload();
      if (state.secret) state.secret = await db.unlockSecret(state.secretPw);
      if (state.picked === d.id) state.picked = null;
      toast('지웠어요');
      route();
    } catch (ex) { toast(ex.message || '지우지 못했어요'); }
    return;
  }
  if (t.dataset.purpose || t.dataset.ftype) {
    const key = t.dataset.purpose ? 'purpose' : 'ftype';
    const val = t.dataset[key];
    const pq = document.getElementById('pq');
    if (pq) pq.value = '';
    stir({ [key]: state[key] === val && !state.secretView && !state.pq.trim() ? '' : val, pq: '', secretView: false, picked: null });
  } else if (t.dataset.pick) {
    state.picked = t.dataset.pick;
    document.querySelectorAll('.tile').forEach((el) => el.classList.toggle('on', el.dataset.pick === state.picked));
    paintDetail();
  } else if (t.dataset.copy) {
    const d = findItem(t.dataset.copy);
    try { await navigator.clipboard.writeText(d.body || ''); toast('멘트를 복사했어요'); } catch { toast('복사하지 못했어요'); }
  } else if (t.dataset.tab) {
    state.noteTab = t.dataset.tab; state.noteSub = 'all'; flipBook();
  } else if (t.dataset.sub) {
    state.noteSub = t.dataset.sub; flipBook();
  } else {
    const act = t.dataset.act;
    if (act === 'stir') stir({});
    else if (act === 'secret-view') stir({ secretView: !state.secretView, picked: null });
    else if (act === 'flip') flipBook();
    else if (act === 'add') openSheet(t.dataset.section);
    else if (act === 'close-sheet') closeSheet();
    else if (act === 'relock') {
      state.secret = null;
      state.secretPw = '';
      db.lockSecret();
      if (state.secretView) { state.secretView = false; state.picked = null; }
      route();
    } else if (act === 'signout') {
      await db.signOut();
      Object.assign(state, { items: [], secret: null, secretPw: '', purpose: '', ftype: '', pq: '', secretView: false, picked: null });
      go('enter');
    }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetRoot.firstChild) closeSheet(); });

(async function start() {
  if (await db.getSession()) await reload();
  route();
})();
})();

</script>
