# Supabase 무료 플랜은 7일간 요청이 없으면 창고를 일시정지한다.
# 3일마다 가벼운 조회를 한 번 보내 깨어 있게 한다. (공개 키만 사용, 자료는 RLS로 막혀 있어 빈 결과가 돌아옴)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sni's recipe storage
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://tqhlzcchzjgetfwcmpfz.supabase.co/rest/v1/items?select=id&limit=1" \
            -H "apikey: sb_publishable_qyCoxkztB1VsNgyG7iN6tQ_fWmYhOEq")
          echo "status $code"
          test "$code" = "200"
